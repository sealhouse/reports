# Starts ci's sealhouse-timer again if its chain of runs has broken: when this fires and no timer link is waiting.
# The schedule lives here because GitHub turns a repository's schedules off after 60 days without a commit, and the
# hourly report commits here. GitHub starts it late or not at all, so the timer keeps its own time.
name: sealhouse-tick

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the timer unless a link is waiting
        env:
          DISPATCH_APP_ID: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
          DISPATCH_APP_KEY: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
        run: |
          git clone -q --depth 1 https://github.com/sealhouse/ci.git ci
          ci/hack/timer-next.sh --start
